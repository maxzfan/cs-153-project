name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (macOS)
        run: npm run build:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRO_PRICE_ID: ${{ secrets.VITE_STRIPE_PRO_PRICE_ID }}
          VITE_STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.VITE_STRIPE_ENTERPRISE_PRICE_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 5

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        run: npm run build && npm run build:electron && npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRO_PRICE_ID: ${{ secrets.VITE_STRIPE_PRO_PRICE_ID }}
          VITE_STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.VITE_STRIPE_ENTERPRISE_PRICE_ID }}

      - name: Verify Windows artifact (rhino3dm + web-ifc WASM blobs present)
        shell: bash
        run: |
          exe=$(ls release/*Setup*.exe | head -1)
          echo "Verifying: $exe"
          node scripts/verify-windows-artifact.cjs "$exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*.exe
          retention-days: 5

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          path: ./artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: ./artifacts

      - name: Generate SHA256 checksums
        run: |
          cd ./artifacts
          sha256sum *.dmg *.zip *.exe > checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 0studio v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.dmg
            ./artifacts/*.zip
            ./artifacts/*.exe
            ./artifacts/checksums.txt
          body: |
            ## 0studio v${{ steps.version.outputs.version }}

            ### Downloads

            **macOS**
            - `0studio-${{ steps.version.outputs.version }}-arm64.dmg` — Apple Silicon (M1/M2/M3/M4)
            - `0studio-${{ steps.version.outputs.version }}.dmg` — Intel Mac

            **Windows**
            - `0studio-${{ steps.version.outputs.version }}-Setup.exe` — Windows installer (x64)

            > ⚠️ **macOS**: If Gatekeeper blocks the app, right-click → Open, or go to System Settings → Privacy & Security → "Open Anyway".
            > ⚠️ **Windows**: SmartScreen may warn "Unknown publisher" — click "More info" → "Run anyway". The app is not yet code-signed.

            **Required**: An internet connection is needed for cloud sync, sign-in, and updates. 3D model loading works offline (rhino3dm and web-ifc are bundled locally).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
